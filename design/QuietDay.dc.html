<!doctype html>
<html>
<head>

</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #0a0a0a; -webkit-font-smoothing: antialiased; }
    a { color: #fafafa; text-decoration: none; }
    a:hover { color: #ffffff; }
  </style>
</helmet>
<div style="width: 960px; height: 640px; background: #0a0a0a; color: #fafafa; font-family: 'Geist', system-ui, sans-serif; display: flex;">

  <div style="width: 220px; flex-shrink: 0; border-right: 1px solid rgba(250,250,250,0.10); padding: 18px 0 16px; display: flex; flex-direction: column;">
    <div style="padding: 0 22px 22px;">
      <div style="font-size: 14px; font-weight: 600; letter-spacing: -0.015em;">DevNews</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 12px;">
      <div style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 10px; background: #262626; font-size: 13px; font-weight: 500;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; flex-shrink: 0;"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        <span>Today</span>
        <span style="margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 11px; color: #5a5a5a;">0</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 10px; font-size: 13px; color: #a1a1a1;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; flex-shrink: 0;"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
        <span>Archive</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 10px; font-size: 13px; color: #a1a1a1;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; flex-shrink: 0;"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
        <span>Preferences</span>
      </div>
    </div>
    <div style="margin-top: auto; padding: 0 12px;">
      <div style="display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 10px; border-radius: 10px;">
        <span style="width: 22px; height: 22px; border-radius: 999px; background: #262626; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #a1a1a1; flex-shrink: 0;">M</span>
        <span style="font-size: 12px; color: #a1a1a1;">maurya</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="#6f6f6f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 15px; height: 15px; margin-left: auto; flex-shrink: 0;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 30px 34px; display: flex; flex-direction: column;">
    <div>
      <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.022em;">Saturday, 6 September</h1>
      <p style="margin: 6px 0 0; font-size: 13px; color: #a1a1a1;">18 candidates &middot; none cleared 4.0</p>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 40px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3a3a3a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" style="width: 30px; height: 30px;"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
      <h2 style="margin: 20px 0 0; font-size: 17px; font-weight: 500; letter-spacing: -0.012em;">Quiet day</h2>
      <p style="margin: 9px 0 0; font-size: 14px; line-height: 1.65; color: #a1a1a1; max-width: 46ch;">Nothing today was worth your attention. Padding the list out to look busy would waste more of your time than an empty page does.</p>
      <div style="margin-top: 22px; height: 32px; border-radius: 10px; border: 1px solid rgba(250,250,250,0.14); background: rgba(250,250,250,0.03); display: inline-flex; align-items: center; padding: 0 14px; font-size: 13px; font-weight: 500; color: #d4d4d4;">See what was rejected</div>
    </div>
  </div>
</div>
</x-dc>
